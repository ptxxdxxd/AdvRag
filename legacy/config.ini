# Configuration file for Advanced RAG System

[model_config]
# Base models for the system
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
generation_model = "gpt-3.5-turbo"
chunk_size = 512
chunk_overlap = 50
top_k_retrieval = 5

[api_config]
# LLM Provider configurations
openai_api_key = ""
anthropic_api_key = ""
huggingface_api_key = ""

[performance_config]
# Performance thresholds and settings
response_time_threshold = 5.0
cost_per_query_threshold = 0.01
error_rate_threshold = 0.05
retrieval_score_threshold = 0.7

# Monitoring settings
log_level = "INFO"
metrics_collection_interval = 60  # seconds

[training_config]
# Fine-tuning parameters
learning_rate = 2e-5
batch_size = 16
num_epochs = 3
max_seq_length = 512
warmup_steps = 1000
weight_decay = 0.01

[storage_config]
# Storage settings
data_directory = "./data"
models_directory = "./models"
performance_logs_directory = "./data/performance"
temp_directory = "./tmp"

[web_config]
# Web interface settings
streamlit_port = 8501
enable_debug = false
theme_primary_color = "#1e3a8a"
enable_analytics = true